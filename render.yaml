services:
  - type: web
    name: knowra-demo
    runtime: docker
    plan: free
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile.demo
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LLM_PROVIDER
        value: gemini
