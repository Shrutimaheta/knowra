services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      POSTGRES_DB: knowra
      POSTGRES_USER: knowra_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sh:/docker-entrypoint-initdb.d/01-runtime-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowra_migrator -d knowra"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://knowra_migrator:${POSTGRES_PASSWORD}@db:5432/knowra
    command: ["python", "-c", "from app.store import initialize; initialize()"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./apps/api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://knowra_app:${APP_DB_PASSWORD}@db:5432/knowra
      EMBEDDED_WORKER: 'false'
      AUTO_MIGRATE: 'false'
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./apps/api
    env_file: .env
    environment:
      AUTO_MIGRATE: 'false'
      DATABASE_URL: postgresql+psycopg://knowra_app:${APP_DB_PASSWORD}@db:5432/knowra
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
volumes:
  postgres-data:
